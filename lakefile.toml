name = "forseti_examples"
version = "0.1.0"
defaultTargets = ["AntitheticFeedback", "Burgers", "BurgersFronts", "CircuitProofs", "EnergyOptimization", "Euler", "HedgedSpread", "HedgedSpreadRisk", "LinearCircuitFibonacci", "LinearCircuitJordan", "Lorenz", "NS_B2", "NS_K5", "NS_Laminar", "NS_T3", "NavierStokes", "ScalarDecay", "ThreeState"]

[[require]]
name = "forseti"
git = "https://github.com/arnovich/forseti-lean.git"
rev = "36304c70fd2372fc1aa9b1e74643d0d0a516de3a"

[[lean_lib]]
name = "AntitheticFeedback"
srcDir = "examples/biochemistry"

[[lean_lib]]
name = "Burgers"
srcDir = "examples/pdes"
# Generated certificate proofs need the notebook checker's bounded budget.
leanOptions = { maxHeartbeats = 500000 }

[[lean_lib]]
name = "BurgersFronts"
srcDir = "examples/pdes"
leanOptions = { maxHeartbeats = 500000 }

[[lean_lib]]
name = "CircuitProofs"
srcDir = "examples/circuits"

[[lean_lib]]
name = "EnergyOptimization"
srcDir = "examples/circuits"

[[lean_lib]]
name = "Euler"
srcDir = "examples/pdes"

[[lean_lib]]
name = "HedgedSpread"
srcDir = "examples/finance"

[[lean_lib]]
name = "HedgedSpreadRisk"
srcDir = "examples/finance"

[[lean_lib]]
name = "LinearCircuitFibonacci"
srcDir = "examples/circuits"

[[lean_lib]]
name = "LinearCircuitJordan"
srcDir = "examples/circuits"

[[lean_lib]]
name = "Lorenz"
srcDir = "examples/dynamics"

[[lean_lib]]
name = "NS_B2"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NS_K5"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NS_Laminar"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NS_T3"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NavierStokes"
srcDir = "examples/pdes"

[[lean_lib]]
name = "ScalarDecay"
srcDir = "examples/basics"

[[lean_lib]]
name = "ThreeState"
srcDir = "examples/basics"

# The AIF safety certificates: every cell of the moving tube and the assembled
# theorem. Opt-in, and not a default target: a full build takes about 30 hours
# of processor time and over 7 GB of memory per cell. Build it with
# `lake build AIFSafety`, or one module at a time (see certificates/README.md).
[[lean_lib]]
name = "AIFSafety"
srcDir = "certificates"
globs = ["AIFSafety.*"]
