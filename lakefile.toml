name = "forseti_examples"
version = "0.1.0"
defaultTargets = ["Burgers", "BurgersFronts", "CircuitProofs", "EnergyOptimization", "Euler", "LinearCircuitFibonacci", "LinearCircuitJordan", "Lorenz", "NS_B2", "NS_K5", "NS_Laminar", "NS_T3", "NavierStokes", "ScalarDecay", "ThreeState"]

[[require]]
name = "forseti"
git = "https://github.com/arnovich/forseti-lean.git"
rev = "c65dada148ecd4148259cb4bb6d6268ea04d8174"

[[lean_lib]]
name = "Burgers"
srcDir = "examples/pdes"
# Generated certificate proofs need the notebook checker's bounded budget.
leanOptions = { maxHeartbeats = 500000 }

[[lean_lib]]
name = "BurgersFronts"
srcDir = "examples/pdes"
leanOptions = { maxHeartbeats = 500000 }

[[lean_lib]]
name = "CircuitProofs"
srcDir = "examples/circuits"

[[lean_lib]]
name = "EnergyOptimization"
srcDir = "examples/circuits"

[[lean_lib]]
name = "Euler"
srcDir = "examples/pdes"

[[lean_lib]]
name = "LinearCircuitFibonacci"
srcDir = "examples/circuits"

[[lean_lib]]
name = "LinearCircuitJordan"
srcDir = "examples/circuits"

[[lean_lib]]
name = "Lorenz"
srcDir = "examples/dynamics"

[[lean_lib]]
name = "NS_B2"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NS_K5"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NS_Laminar"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NS_T3"
srcDir = "examples/galerkin"

[[lean_lib]]
name = "NavierStokes"
srcDir = "examples/pdes"

[[lean_lib]]
name = "ScalarDecay"
srcDir = "examples/basics"

[[lean_lib]]
name = "ThreeState"
srcDir = "examples/basics"
