<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="Helvetica, Arial, sans-serif"><rect width="840" height="330" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#222" text-anchor="start" font-weight="700">One rectangle of the g × g grid (corners a, a′ in one row, b, b′ in the next)</text><text x="20" y="52" font-size="12" fill="#666" text-anchor="start" font-weight="400">Corner strings: x = z_a(b′), y = z_a′(b), u = z_b(a′), v = z_b′(a). Dashed: the hyperedge [x ⊕ y ⊕ u ⊕ v = 0].</text><text x="130" y="80" font-size="14" fill="#222" text-anchor="middle" font-weight="700">2 × the two diagonals</text><line x1="50" y1="110" x2="210" y2="250" stroke="#222" stroke-width="2.4"/><line x1="210" y1="110" x2="50" y2="250" stroke="#222" stroke-width="2.4"/><text x="130" y="300" font-size="12" fill="#666" text-anchor="middle" font-weight="400">[x = v]·[y = u]: 6 bits either way</text><circle cx="50" cy="110" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="50" y="115" font-size="13" fill="#222" text-anchor="middle" font-weight="700">a</text><text x="22" y="115" font-size="12" fill="#666" text-anchor="middle" font-weight="400">x</text><circle cx="210" cy="110" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="210" y="115" font-size="13" fill="#222" text-anchor="middle" font-weight="700">a′</text><text x="238" y="115" font-size="12" fill="#666" text-anchor="middle" font-weight="400">y</text><circle cx="50" cy="250" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="50" y="255" font-size="13" fill="#222" text-anchor="middle" font-weight="700">b</text><text x="22" y="255" font-size="12" fill="#666" text-anchor="middle" font-weight="400">u</text><circle cx="210" cy="250" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="210" y="255" font-size="13" fill="#222" text-anchor="middle" font-weight="700">b′</text><text x="238" y="255" font-size="12" fill="#666" text-anchor="middle" font-weight="400">v</text><text x="275" y="185" font-size="26" fill="#222" text-anchor="middle" font-weight="700">=</text><text x="410" y="80" font-size="14" fill="#222" text-anchor="middle" font-weight="700">row choice R</text><line x1="330" y1="110" x2="410" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="490" y1="110" x2="410" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="330" y1="250" x2="410" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="490" y1="250" x2="410" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="410" cy="180" r="5" fill="#7a52b3"/><line x1="330" y1="110" x2="490" y2="110" stroke="#2f6db3" stroke-width="2.6"/><line x1="330" y1="250" x2="490" y2="250" stroke="#2f6db3" stroke-width="2.6"/><text x="410" y="300" font-size="12" fill="#666" text-anchor="middle" font-weight="400">σ(x,y)σ(v,u): 3 bits after merging rows</text><circle cx="330" cy="110" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="330" y="115" font-size="13" fill="#222" text-anchor="middle" font-weight="700">a</text><text x="302" y="115" font-size="12" fill="#666" text-anchor="middle" font-weight="400">x</text><circle cx="490" cy="110" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="490" y="115" font-size="13" fill="#222" text-anchor="middle" font-weight="700">a′</text><text x="518" y="115" font-size="12" fill="#666" text-anchor="middle" font-weight="400">y</text><circle cx="330" cy="250" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="330" y="255" font-size="13" fill="#222" text-anchor="middle" font-weight="700">b</text><text x="302" y="255" font-size="12" fill="#666" text-anchor="middle" font-weight="400">u</text><circle cx="490" cy="250" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="490" y="255" font-size="13" fill="#222" text-anchor="middle" font-weight="700">b′</text><text x="518" y="255" font-size="12" fill="#666" text-anchor="middle" font-weight="400">v</text><text x="555" y="185" font-size="26" fill="#222" text-anchor="middle" font-weight="700">+</text><text x="690" y="80" font-size="14" fill="#222" text-anchor="middle" font-weight="700">column choice C</text><line x1="610" y1="110" x2="690" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="770" y1="110" x2="690" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="610" y1="250" x2="690" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><line x1="770" y1="250" x2="690" y2="180" stroke="#7a52b3" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="690" cy="180" r="5" fill="#7a52b3"/><line x1="610" y1="110" x2="610" y2="250" stroke="#c96a1b" stroke-width="2.6"/><line x1="770" y1="110" x2="770" y2="250" stroke="#c96a1b" stroke-width="2.6"/><text x="690" y="300" font-size="12" fill="#666" text-anchor="middle" font-weight="400">σ(x,u)σ(v,y): 3 bits after merging columns</text><circle cx="610" cy="110" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="610" y="115" font-size="13" fill="#222" text-anchor="middle" font-weight="700">a</text><text x="582" y="115" font-size="12" fill="#666" text-anchor="middle" font-weight="400">x</text><circle cx="770" cy="110" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="770" y="115" font-size="13" fill="#222" text-anchor="middle" font-weight="700">a′</text><text x="798" y="115" font-size="12" fill="#666" text-anchor="middle" font-weight="400">y</text><circle cx="610" cy="250" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="610" y="255" font-size="13" fill="#222" text-anchor="middle" font-weight="700">b</text><text x="582" y="255" font-size="12" fill="#666" text-anchor="middle" font-weight="400">u</text><circle cx="770" cy="250" r="17" fill="#f6f6f6" stroke="#555" stroke-width="1.4"/><text x="770" y="255" font-size="13" fill="#222" text-anc