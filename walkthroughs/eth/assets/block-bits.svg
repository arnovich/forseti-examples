<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family="Helvetica, Arial, sans-serif"><rect width="760" height="286" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#222" text-anchor="start" font-weight="700">Bits per block of three, rows and columns together</text><text x="20" y="52" font-size="12" fill="#666" text-anchor="start" font-weight="400">A block costs 3 bits one way and 6 the other; naming the set Q of column blocks costs 1 bit each way.</text><text x="188" y="114" font-size="13" fill="#222" text-anchor="end" font-weight="400">two equality tests</text><rect x="200" y="90" width="204" height="36" rx="4" fill="#2f6db3" fill-opacity="0.18" stroke="#2f6db3"/><text x="302.0" y="113" font-size="12" fill="#2f6db3" text-anchor="middle" font-weight="700">rows: 6</text><rect x="404" y="90" width="204" height="36" rx="4" fill="#c96a1b" fill-opacity="0.18" stroke="#c96a1b"/><text x="506.0" y="113" font-size="12" fill="#c96a1b" text-anchor="middle" font-weight="700">columns: 6</text><text x="618" y="114" font-size="14" fill="#222" text-anchor="start" font-weight="700">= 12</text><text x="188" y="184" font-size="13" fill="#222" text-anchor="end" font-weight="400">Lemma 2, per block</text><rect x="200" y="160" width="102" height="36" rx="4" fill="#2f6db3" fill-opacity="0.18" stroke="#2f6db3"/><text x="251.0" y="183" font-size="12" fill="#2f6db3" text-anchor="middle" font-weight="700">rows: 3</text><rect x="302" y="160" width="204" height="36" rx="4" fill="#c96a1b" fill-opacity="0.18" stroke="#c96a1b"/><text x="404.0" y="183" font-size="12" fill="#c96a1b" text-anchor="middle" font-weight="700">columns: 6</text><rect x="506" y="160" width="68" height="36" rx="4" fill="#7a52b3" fill-opacity="0.18" stroke="#7a52b3"/><text x="540.0" y="183" font-size="12" fill="#7a52b3" text-anchor="middle" font-weight="700">name Q: 2</text><text x="584" y="184" font-size="14" fill="#222" text-anchor="start" font-weight="700">= 11</text><text x="20" y="250" font-size="12" fill="#666" text-anchor="start" font-weight="400">So c^row_i + c^col_i ≤ 11t against 12t: one of the two directions costs at most 5.5t, the factor ρ = 11/12.</text><text x="20" y="268" font-size="12" fill="#666" text-anchor="start" font-weight="400">With the four-square identity on blocks of two bits: 2 + 4 + 1 + 1 = 8 = 4 + 4, no saving.</text></svg>
