<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='470' viewBox='0 0 1000 470' font-family='Helvetica, Arial, sans-serif'>
<rect width='100%' height='100%' fill='#ffffff'/>
<text x='500.0' y='28' font-size='17' text-anchor='middle' font-weight='bold'>Theorem 17: one query pair in one lopsided instance, p = 5, residue class ϱ = 2</text>
<text x='500.0' y='52' font-size='13' text-anchor='middle' fill='#333'>w(a,b) = 7 ≡ 2 (mod 5).   a ~ (c, σ) iff σ ≡ w(a,c) + ϱ;   (c, σ) ~ b iff σ ≡ -w(b,c)   (mod 5)</text>
<line x1='118' y1='250' x2='280' y2='110' stroke='#2e8b57' stroke-width='2'/>
<line x1='380' y1='110' x2='542' y2='250' stroke='#2e8b57' stroke-width='2'/>
<line x1='118' y1='250' x2='280' y2='190' stroke='#c0392b' stroke-width='2'/>
<line x1='380' y1='190' x2='542' y2='250' stroke='#c0392b' stroke-width='2'/>
<line x1='118' y1='250' x2='280' y2='290' stroke='#888888' stroke-width='2'/>
<line x1='380' y1='370' x2='542' y2='250' stroke='#888888' stroke-width='2'/>
<rect x='280' y='93' width='100' height='34' rx='8' fill='#d6f0df' stroke='#2e8b57' stroke-width='1.5'/>
<text x='330' y='115' font-size='14' text-anchor='middle'>(c₁, 1)</text>
<rect x='280' y='173' width='100' height='34' rx='8' fill='#f8d7d3' stroke='#c0392b' stroke-width='1.5'/>
<text x='330' y='195' font-size='14' text-anchor='middle'>(c₂, 0)</text>
<rect x='280' y='273' width='100' height='34' rx='8' fill='#f3f3f3' stroke='#888888' stroke-width='1.5'/>
<text x='330' y='295' font-size='14' text-anchor='middle'>(c₃, 3)</text>
<rect x='280' y='353' width='100' height='34' rx='8' fill='#f3f3f3' stroke='#888888' stroke-width='1.5'/>
<text x='330' y='375' font-size='14' text-anchor='middle'>(c₃, 4)</text>
<circle cx='90' cy='250' r='28' fill='#e8eef8' stroke='#4a6fa5' stroke-width='1.5'/>
<text x='90' y='256' font-size='17' text-anchor='middle'>a</text>
<text x='90' y='300' font-size='12' text-anchor='middle' fill='#444'>part A</text>
<circle cx='570' cy='250' r='28' fill='#e8eef8' stroke='#4a6fa5' stroke-width='1.5'/>
<text x='570' y='256' font-size='17' text-anchor='middle'>b</text>
<text x='570' y='300' font-size='12' text-anchor='middle' fill='#444'>part B</text>
<text x='330' y='418' font-size='12' text-anchor='middle' fill='#444'>middle part C_k × ℤ_p (only the vertices</text>
<text x='330' y='434' font-size='12' text-anchor='middle' fill='#444'>adjacent to a or b are drawn)</text>
<text x='640' y='130' font-size='13' fill='#2e8b57' font-weight='bold'>c₁: w(a,c₁) = 4, w(b,c₁) = -11</text>
<text x='640' y='149' font-size='12.5' fill='#333'>4 + 2 ≡ 1 and 11 ≡ 1.</text>
<text x='640' y='168' font-size='12.5' fill='#2e8b57'>S = 7 + 4 - 11 = 0: a zero triangle.</text>
<text x='640' y='220' font-size='13' fill='#c0392b' font-weight='bold'>c₂: w(a,c₂) = 3, w(b,c₂) = 0</text>
<text x='640' y='239' font-size='12.5' fill='#333'>3 + 2 ≡ 0 and 0 ≡ 0.</text>
<text x='640' y='258' font-size='12.5' fill='#c0392b'>S = 10 ≡ 0 but S ≠ 0: a false positive.</text>
<text x='640' y='310' font-size='13' fill='#888888' font-weight='bold'>c₃: w(a,c₃) = 1, w(b,c₃) = 1</text>
<text x='640' y='329' font-size='12.5' fill='#333'>1 + 2 ≡ 3 but -1 ≡ 4.</text>
<text x='640' y='348' font-size='12.5' fill='#888888'>S = 9 ≢ 0: no common neighbour.</text>
<text x='500.0' y='460' font-size='12.5' text-anchor='middle' fill='#333'>A common neighbour (c, σ) means w(a,c) + ϱ ≡ -w(b,c), that is S(a,b,c) ≡ 0 (mod p). The scan of this accepted pair finds c₁; c₂ is a false positive it may pay for.</text>
</svg>
